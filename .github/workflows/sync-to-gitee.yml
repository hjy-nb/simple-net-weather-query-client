name: Sync to Gitee

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          # 源仓库（GitHub）
          src: github/${{ github.repository_owner }}/${{ github.event.repository.name }}
          # 目标仓库（Gitee）
          dst: git@gitee.com:hou-jiayao-jiayao/simple-net-weather-query-client.git
          # SSH 私钥
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          # Gitee Token
          dst_token: ${{ secrets.GITEE_TOKEN }}
          # 同步的仓库列表（留空表示同步所有）
          static_list: ""
          # 强制更新
          force_update: true
          # 调试模式
          debug: true
